<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한글소리 V3 · 다섯 화면 비교</title><link rel="stylesheet" href="style.css"><style>.gallery-tools{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.gallery-tools select{width:200px;margin:0}.gallery-tools a{font-size:13px;min-height:48px;display:flex;align-items:center}.gallery-grid figure a{color:inherit;text-decoration:none}.gallery-grid figcaption small{display:block;font-size:12px;font-weight:400;color:#53665F;line-height:1.8;margin-top:5px}.gallery-grid img{height:auto;display:block}.gallery-grid figcaption strong{font-weight:500}@media(min-width:1151px){.gallery-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}</style></head>
<body class="gallery"><header><span class="eyebrow">HANGUL SORI · DESIGN V3</span><h1>현재 한글소리를 발전시킨 다섯 화면</h1><p>실제 NotoSansKR · 녹청색 · 작은 수호 캐릭터 · 도자기와 직물의 재질 · 390×844 CSS px 검수 캡처</p><div class="gallery-tools"><select id="gallery-locale" aria-label="비교 화면 언어"><option value="de">Deutsch</option><option value="en">English</option><option value="ko">한국어 · 검토용</option></select><a href="index.html">직접 눌러보기 →</a><a href="motion-lab.html">Hören 터치 모션 →</a><a href="design-notes.html">참조 · 문장 · 적용 명세 →</a></div></header>
<a class="studio-link" href="catalog-board.html" style="margin:0 32px 24px">Lernen · 252개 Packs · Spiele 확장 시안 →</a>
<main class="gallery-grid" id="gallery-grid"></main><script>
const captions=[['today','홈','상황·학습 목표·주 CTA. 기존 호랑이는 작은 크기로 유지.'],['learn','학습','현재 앱의 실제 학습 활동 13개와 원본 그림. 한글·문법·단어·듣기 등을 모두 유지.'],['listen','듣기','문장 이해와 선택이 중심. 재생과 도움은 명확한 버튼으로.'],['conversation','대화','작은 상대 프로필과 큰 한국어 문장. 자연스러운 답변.'],['result','결과','대화를 완료한 뒤의 수행 내용. 다음 행동은 한옥과 오늘로.']];
function show(locale){document.querySelector('#gallery-grid').innerHTML=captions.map(([view,title,desc],i)=>`<figure><a href="index.html?view=${view}&lang=${locale}"><img src="screens/${view}-${locale}.jpg?v=composition797-v5" alt="${title} 화면 · ${locale}"><figcaption><strong>0${i+1} · ${title}</strong><small>${desc}</small></figcaption></a></figure>`).join('');}
const select=document.querySelector('#gallery-locale');select.addEventListener('change',()=>show(select.value));show('de');
</script></body></html>
