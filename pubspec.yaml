name: ko_lernen_app
description: "Hangul Sori (한글소리) — Koreanisch lernen: Hangul, Vokabeln, Grammatik & Spiele"
publish_to: 'none'
version: 2.0.6+25

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Lokalisierung ───────────────────────────────────────
  flutter_localizations:
    sdk: flutter
  intl: any

  # ── Daten / Persistenz ──────────────────────────────────
  csv: ^6.0.0
  shared_preferences: ^2.3.0
  # Exact pin: 7.0 keeps the current iOS/Xcode floor while supporting this
  # project's Flutter 3.44, AGP 9.0, and Gradle 9.1 toolchain.
  connectivity_plus: 7.0.0

  # ── Audio / Sprache ─────────────────────────────────────
  # flutter_tts 는 2026-08-19 에 제거했다. OS 음성 폴백이 독일어 엔진으로
  # 한국어를 읽어("전부 das" — Jin) 발음 학습을 망가뜨렸고, Storage 실측상
  # 발화 11,438개 중 프리미엄이 없는 건 1개뿐이라 폴백이 필요 없다.
  # 자세한 이유는 TtsService 클래스 주석 참조.
  # SFX (정답/오답/콤보/레벨업) — assets/sfx/*.mp3. 에셋 없으면 SoundService가
  # 조용히 무음 처리(no-op). Jin이 mp3 5개 넣으면 자동 재생.
  audioplayers: ^6.8.1

  # ── UI ──────────────────────────────────────────────────
  flutter_svg: ^2.0.10
  animations: ^2.0.11        # OpenContainer Material container transform

  # ── Werbung ─────────────────────────────────────────────
  # ⚠️ google_mobile_ads (5.x) inkompatibel mit aktuellem AGP/Gradle
  #    ("unknown property 'all' for configuration container").
  #    Temporär deaktiviert — ad_service.dart und banner_ad.dart sind Stubs.
  #    Bei Production-Release: Plugin-Update abwarten oder Stub durch
  #    Plugin ersetzen, sobald kompatible Version verfügbar.
  # google_mobile_ads: 5.2.0

  # ── Firebase + Google Sign-In ───────────────────────────
  firebase_core:           ^4.13.0
  firebase_auth:           ^6.5.7
  # 7.x requires an authentication-flow migration. Keep the latest compatible
  # 6.x line in this maintenance batch so account-link/recovery semantics stay
  # stable across Android, iOS, and Web.
  google_sign_in:          ^6.3.0
  cloud_firestore:         ^6.8.0
  firebase_remote_config:  ^6.5.6   # v6.0 palette kill-switch (dancheong ↔ teal)
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7
  firebase_messaging: ^16.5.0   # Phase 7 — 계 피드 푸시(목표 달성). ⚠️ iOS APNs 필요
  firebase_storage: ^13.4.6     # 고품질 TTS mp3 (사전생성 + 동적 CF 캐시). auth-gated read.

  # ── Phase 5 (stately-rising-jongga) — 책 한 컷 ───────────
  # OCR: ML Kit (on-device, 무료, 한국어 지원)
  # 0.16 aligns its iOS ML Kit dependencies with Firebase 12.
  google_mlkit_text_recognition: ^0.16.0
  # OCR 입력의 조합형 자모(NFD)를 서버와 같은 NFC 계약으로 정규화.
  unorm_dart: ^0.3.2
  # 사진 캡쳐 + 자르기
  image_picker:   ^1.2.3
  image_cropper:  ^8.0.2
  # 촬영 품질 게이트(리사이즈·선명도·명암) 로컬 계산.
  image: 4.8.0
  # 권한 요청 (카메라 + 사진)
  permission_handler: ^11.3.1
  # Explicitly consented, at-most-10-second PCM16 pronunciation assessment.
  record: ^7.1.1
  # Cloud Function HTTP 호출
  http: ^1.2.2
  # 단어 첨부 사진을 앱 문서 폴더에 영구 저장 (나만의 단어장 v2.0)
  path_provider: ^2.1.5

  # ── 공유 (Phase 5.2 — 커스텀팩 친구 공유) ───────────────────
  share_plus: ^13.3.0

  # ── Abo / In-App-Kauf (RevenueCat) — €5/Monat Premium ───
  # ⚠️ Nach dem Hinzufügen `flutter pub get` ausführen.
  #    RevenueCat-Dashboard: Entitlement "premium" + Offering (Monatspaket)
  #    anlegen und Store-Produkte verknüpfen. Public-SDK-Keys via
  #    --dart-define=RC_ANDROID_KEY=goog_… / RC_IOS_KEY=appl_… injizieren.
  #    Ohne Keys läuft PremiumService im "kostenlos"-Modus (kein Crash).
  purchases_flutter: ^10.7.0

  # ── Lokale Benachrichtigungen (M3) — tägliche Lern-Erinnerung ───
  # Erfordert Android core library desugaring (siehe android/app/build.gradle.kts)
  # + Manifest-Receiver. zonedSchedule braucht die lokale IANA-Zeitzone.
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.0
  flutter_timezone: ^5.1.0
  rive: ^0.14.11
  url_launcher: ^6.3.2
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  video_player: ^2.11.1
  flutter_native_splash: ^2.4.2
  cloud_functions: ^6.3.6
  firebase_app_check: ^0.4.6
  firebase_app_check_platform_interface: ^0.4.2
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  uuid: ^4.5.1

dev_dependencies:
  analyzer: ^10.1.0
  flutter_test:
    sdk: flutter
  # 실기기·에뮬레이터 전용 통합 테스트 (integration_test/). CI 러너에는 기기가
  # 없어 여기서는 돌지 않는다 — CI 회귀는 test/e2e/ 가 담당한다.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences_platform_interface: ^2.4.2
  xml: ^6.6.1

  # ── Icon / Splash Generierung ───────────────────────────
  flutter_launcher_icons: ^0.14.1

flutter:
  # Runner deliberately uses CocoaPods only. Flutter 3.44 enables SwiftPM by
  # default on macOS; without this project-level override, Xcode Cloud sends
  # supported plugins (including audioplayers_darwin) to the removed
  # FlutterGeneratedPluginSwiftPackage integration and the archive cannot link.
  config:
    enable-swift-package-manager: false

  uses-material-design: true
  generate: true                   # für ARB Localisations

  assets:
    - assets/data/
    - docs/data/cultural_glossary.json
    - assets/icons/
    - assets/illustrations/hanok/
    # hanok_compound/ (동결 프로토타입, lib/ 참조 0건) — 번들에서 제외해 ~11MB 절감.
    # 파일은 저장소에 보존(삭제 아님). personal_hanok_v2/ 가 정본. 되살리려면 이 줄 복구.
    # - assets/illustrations/hanok_compound/
    # Flutter only includes files immediately inside a declared directory.
    # The canonical estate deliberately has nested map/interior folders, so
    # each runtime leaf directory must be listed explicitly.
    - assets/illustrations/personal_hanok_v2/map/
    - assets/illustrations/personal_hanok_v2/map/structures/
    - assets/illustrations/personal_hanok_v2/map/landscape/
    # B1/B2 estate construction stages (14 non-final PNGs, flattened;
    # each building's final stage is byte-identical to its structures/ or
    # landscape/ file above and is not duplicated here).
    - assets/illustrations/personal_hanok_v2/map/stages/
    - assets/illustrations/personal_hanok_v2/interiors/
    # A1 16 construction states, promoted 2026-08-17 as one approved set.
    # tool/promote_hanok_a1_states.py refuses a partial set, so this stays all-or-nothing.
    - assets/illustrations/personal_hanok_v2/a1/states/
    - assets/illustrations/hanok_stages/
    - assets/illustrations/decorations/
    - assets/illustrations/reward/
    - assets/illustrations/stamps/
    - assets/illustrations/mascot/
    - assets/illustrations/burst/
    - assets/illustrations/gye/
    - assets/illustrations/book/
    - assets/illustrations/scenes/
    - assets/illustrations/error/
    - assets/illustrations/onboarding/
    # 단어팩 motif 일러스트 (2026-08-13 UI 개편 Phase 1) — 규약:
    # packs/{DancheongMotif.name}.webp. 파일이 없으면 PackCard 가 단청 도장
    # 폴백을 그리므로, 아트 드롭 전에도 화면은 정상 배포된다.
    - assets/illustrations/packs/
    # 활동 카탈로그 일러스트 (Phase 3) — 규약:
    # activities/{activityId}.webp. 폴백 = ActivityIconFallback(원형 아이콘).
    - assets/illustrations/activities/
    # Sori Deck 2.0 액션 아이콘 (§R-3 커스텀 드롭 전에는 Material 폴백)
    - assets/illustrations/deck/
    # 듣기 카드 일러스트 — 규약: listening/{Key}.webp (Key = docs/LISTENING_CARD_ART_SPEC.md).
    # 없으면 SoriIllustratedCard 의 errorBuilder 가 폴백을 그린다.
    - assets/illustrations/listening/
    # 책가도 서재 목재·소품 — 108칸(6레벨×12칸+ 확장 여유) 공용, 칸별 아트 아님.
    - assets/illustrations/chaekgado/
    - assets/stickers/
    - assets/sfx/
    - assets/rive/
    - assets/video/
    - assets/video/loops/
    - assets/video/character/
    - assets/video/home_hero/
    - assets/video/gye/

  # ── Wanted Sans (한글 11,172자 + 라틴/독일어 완비, OFL 1.1, 2026-08-19 교체) ──
  # ⚠️ 이전 PretendardStd 는 라틴 전용 서브셋이라 한글 글리프가 0개였다 — 한국어가
  # 전부 OS 폴백 폰트로 그려졌다. test/font_bundle_guard_test.dart 가 재발을 막는다.
  # WantedSansStd(라틴 전용)는 쓰지 말 것.
  fonts:
    - family: WantedSans
      fonts:
        - asset: assets/fonts/WantedSans/WantedSans-Regular.otf
          weight: 400
        - asset: assets/fonts/WantedSans/WantedSans-Medium.otf
          weight: 500
        - asset: assets/fonts/WantedSans/WantedSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/WantedSans/WantedSans-Bold.otf
          weight: 700
        - asset: assets/fonts/WantedSans/WantedSans-ExtraBold.otf
          weight: 800
    # Maru Buri는 한국어 문화 제목·완료 순간에만 쓰는 display family다.
    # DE/EN UI, 버튼, 학습 본문은 Wanted Sans를 유지한다.
    - family: MaruBuri
      fonts:
        - asset: assets/fonts/MaruBuri/MaruBuri-Regular.otf
          weight: 400
        - asset: assets/fonts/MaruBuri/MaruBuri-SemiBold.otf
          weight: 600

# ─────────────────────────────────────────────────────────
# Launcher Icon — generiert mit:
#   flutter pub run flutter_launcher_icons
# ─────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/HanLogo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FAF6EC"
  adaptive_icon_foreground: "assets/icons/HanLogo.png"
  remove_alpha_ios: true
  background_color_ios: "#2AB7A9"

# ─────────────────────────────────────────────────────────
# Splash Screen — generiert mit:
#   flutter pub run flutter_native_splash:create
# ─────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#FAF6EC"
  image: assets/icons/HanLogo.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: assets/icons/HanLogo.png
    color: "#FAF6EC"
