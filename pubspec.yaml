name: ko_lernen_app
description: "Hangul Sori (한글소리) — Koreanisch lernen: Hangul, Vokabeln, Grammatik & Spiele"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Lokalisierung ───────────────────────────────────────
  flutter_localizations:
    sdk: flutter
  intl: any

  # ── Daten / Persistenz ──────────────────────────────────
  csv: ^6.0.0
  shared_preferences: ^2.3.0

  # ── Audio / Sprache ─────────────────────────────────────
  flutter_tts: ^4.2.0

  # ── UI ──────────────────────────────────────────────────
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  animations: ^2.0.11        # OpenContainer Material container transform

  # ── Werbung ─────────────────────────────────────────────
  # ⚠️ google_mobile_ads (5.x) inkompatibel mit aktuellem AGP/Gradle
  #    ("unknown property 'all' for configuration container").
  #    Temporär deaktiviert — ad_service.dart und banner_ad.dart sind Stubs.
  #    Bei Production-Release: Plugin-Update abwarten oder Stub durch
  #    Plugin ersetzen, sobald kompatible Version verfügbar.
  # google_mobile_ads: 5.2.0

  # ── Firebase + Google Sign-In ───────────────────────────
  firebase_core:           ^3.6.0
  firebase_auth:           ^5.3.1
  google_sign_in:          ^6.2.1
  cloud_firestore:         ^5.4.4
  firebase_remote_config:  ^5.1.4   # v6.0 palette kill-switch (dancheong ↔ teal)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ── Icon / Splash Generierung ───────────────────────────
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash:  ^2.4.2

flutter:
  uses-material-design: true
  generate: true                   # für ARB Localisations

  assets:
    - assets/data/
    - assets/icons/
    - assets/illustrations/hanok/

  # ── Pretendard (한국어 모던 산세리프, SIL OFL, Std subset ~310KB×5) ──
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard/PretendardStd-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard/PretendardStd-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard/PretendardStd-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard/PretendardStd-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard/PretendardStd-ExtraBold.otf
          weight: 800

# ─────────────────────────────────────────────────────────
# Launcher Icon — generiert mit:
#   flutter pub run flutter_launcher_icons
# ─────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon-512.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2AB7A9"
  adaptive_icon_foreground: "assets/icons/icon-512.png"
  remove_alpha_ios: true

# ─────────────────────────────────────────────────────────
# Splash Screen — generiert mit:
#   flutter pub run flutter_native_splash:create
# ─────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#2AB7A9"
  image: assets/icons/icon-512.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: assets/icons/icon-512.png
    color: "#2AB7A9"
