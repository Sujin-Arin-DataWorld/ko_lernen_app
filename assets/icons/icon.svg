<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ─── Sori v3.1 brand icon: 한 + 갓 (모자처럼 머리 위에) ───────
       청록 배경 + 흰 한 글자 + 한 위에 작은 갓 (귀여운 모자 느낌)
       마스코트 까치+갓 풍속과 일관 + 한국 글자 정체성 명료
  ────────────────────────────────────────────────────── -->

  <defs>
    <!-- 갓 본체 미세한 luster -->
    <linearGradient id="gatBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2a2a2a"/>
      <stop offset="55%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <!-- 갓끈 (gold band) -->
    <linearGradient id="gatBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#F5C84D"/>
      <stop offset="100%" stop-color="#B58A1A"/>
    </linearGradient>
  </defs>

  <!-- ─── Teal background (rounded for adaptive icon) ────── -->
  <rect width="512" height="512" rx="96" fill="#2AB7A9"/>

  <!-- ─── 한 글자 (white, ExtraBold) — main brand element ── -->
  <text x="256" y="430" text-anchor="middle"
        font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif"
        font-size="300" font-weight="900" fill="#FFFFFF"
        letter-spacing="-6">한</text>

  <!-- ─── 작은 갓 (한 머리 위에 모자처럼) ─────────────────── -->
  <!-- 챙 (brim — wide ellipse) -->
  <ellipse cx="256" cy="178" rx="128" ry="13" fill="#0d0d0d"/>
  <!-- 챙 살짝 highlight -->
  <ellipse cx="256" cy="173" rx="122" ry="3" fill="#1f1f1f" opacity="0.6"/>

  <!-- 본체 (cylinder) -->
  <path d="M 192 95
           Q 192 76, 256 76
           Q 320 76, 320 95
           L 320 168
           Q 320 175, 256 175
           Q 192 175, 192 168 Z"
        fill="url(#gatBody)"/>

  <!-- 본체 윗부분 ellipse (top oval) -->
  <ellipse cx="256" cy="93" rx="64" ry="8" fill="#252525"/>
  <ellipse cx="256" cy="90" rx="56" ry="3" fill="#3a3a3a" opacity="0.5"/>

  <!-- 갓끈 (gold band where body meets brim) -->
  <rect x="192" y="161" width="128" height="7" fill="url(#gatBand)"/>
  <rect x="192" y="161" width="128" height="1.5" fill="#FFE799" opacity="0.6"/>
</svg>
