<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ─── Sori v3 brand icon: 갓 + ㅎ ───────────────────────────
       Background: Korean indigo (단청 청, SoriColors.primary)
       Mascot tie-in: 까치호랑이 풍속의 갓을 brand symbol로
       Inscribed: ㅎ (한글 첫 자음, 한국 발음의 핵심)
  ────────────────────────────────────────────────────── -->

  <defs>
    <!-- 갓 본체 미세한 luster -->
    <linearGradient id="gatBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#262626"/>
      <stop offset="60%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <!-- 갓끈 (gold band) -->
    <linearGradient id="gatBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#F5C84D"/>
      <stop offset="100%" stop-color="#B58A1A"/>
    </linearGradient>
  </defs>

  <!-- ─── Indigo background (rounded for adaptive icon) ──── -->
  <rect width="512" height="512" rx="96" fill="#2C3E94"/>

  <!-- ─── 갓 ─────────────────────────────────────────────────
       구성: 챙(brim) + 본체(crown cylinder) + 끈(band)
  ────────────────────────────────────────────────────── -->

  <!-- 챙 (brim — wide ellipse, 위에서 약간 perspective) -->
  <ellipse cx="256" cy="382" rx="206" ry="32" fill="#0d0d0d"/>
  <!-- 챙 윗면 살짝 highlight -->
  <ellipse cx="256" cy="376" rx="200" ry="6" fill="#1f1f1f" opacity="0.7"/>

  <!-- 본체 (cylinder) -->
  <path d="M 156 156
           Q 156 134, 256 134
           Q 356 134, 356 156
           L 356 358
           Q 356 374, 256 374
           Q 156 374, 156 358 Z"
        fill="url(#gatBody)"/>

  <!-- 본체 윗 가장자리 ellipse (top oval - 3D 느낌) -->
  <ellipse cx="256" cy="156" rx="100" ry="14" fill="#202020"/>
  <ellipse cx="256" cy="152" rx="92" ry="6" fill="#2e2e2e" opacity="0.7"/>

  <!-- 갓끈 (gold band at base of crown) -->
  <rect x="156" y="346" width="200" height="9" fill="url(#gatBand)"/>
  <!-- 갓끈 thin highlight -->
  <rect x="156" y="346" width="200" height="2" fill="#FFE799" opacity="0.6"/>

  <!-- ─── ㅎ (한글 첫 자음, 흰색) ───────────────────────────── -->
  <!-- Wing (top short slash, slanted) -->
  <path d="M 234 184 L 268 218"
        stroke="#FFFFFF" stroke-width="18"
        stroke-linecap="round" fill="none"/>

  <!-- Horizontal stroke -->
  <line x1="178" y1="238" x2="334" y2="238"
        stroke="#FFFFFF" stroke-width="20"
        stroke-linecap="round"/>

  <!-- Circle (ㅇ component of ㅎ) -->
  <circle cx="256" cy="298" r="42"
          stroke="#FFFFFF" stroke-width="18"
          fill="none"/>
</svg>
