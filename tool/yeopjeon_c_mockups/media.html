<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>making money · 투명 영상 검토</title><link rel="stylesheet" href="style.css"><style>main{max-width:1120px;margin:auto;padding:24px}h1{font-size:28px;letter-spacing:-1px}.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.stage{border-radius:24px;overflow:hidden;aspect-ratio:1;position:relative}.stage.paper{background:#f6ede0}.stage.jade{background:#1c5148}.stage.checker{background-color:#f6ede0;background-image:conic-gradient(#d9ccba 25%,transparent 0 50%,#d9ccba 0 75%,transparent 0);background-size:24px 24px}.stage video{width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:normal}.video-controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.video-controls button{background:#e9c98a;border:1px solid #82522f;border-radius:8px;min-height:44px;padding:8px 16px}.video-controls label{min-height:44px;display:flex;gap:8px;align-items:center}.report{font-size:13px;line-height:1.8}a{display:inline-block;min-height:44px;padding:12px 0}p{line-height:1.7}img{max-width:100%}@media(max-width:650px){.media-grid{grid-template-columns:1fr}main{padding:16px}}</style></head><body><main><a href="index.html">← 보상 목업으로</a><h1>흰 배경 없이, 도깨비가 건네는 엽전.</h1><p>같은 투명 영상 파일을 한지와 녹청 위에서 재생합니다. 원본 MP4는 그대로 보존했습니다.</p><div class="video-controls"><button id="play">두 화면 재생</button><button id="pause">멈추기</button><button data-time="0">0초 · 준비</button><button data-time="2">2초 · 방망이</button><button data-time="3.75">3.75초 · 엽전</button><button data-time="5">5초 · 수령</button><label><input id="checker" type="checkbox">투명 격자</label></div><div class="media-grid"><section><h2>한지</h2><div class="stage paper"><video id="paper-video" playsinline muted controls preload="auto" src="assets/making_money_alpha.webm" poster="media-review/frame-000.png"></video></div></section><section><h2>녹청</h2><div class="stage jade"><video id="jade-video" playsinline muted controls preload="auto" src="assets/making_money_alpha.webm" poster="media-review/frame-000.png"></video></div></section></div><p class="report" id="report"></p><p><a href="assets/making_money_alpha.webm">투명 WebM 파일</a> · <a href="assets/making_money.mp4">보존한 원본 MP4</a> · <a href="media-review/video-alpha-report.json">알파·프레임 검증 기록</a></p><details><summary>원본 움직임의 투명 처리 프레임 확인</summary><img src="media-review/video-matte-inspection.jpg" alt="준비, 방망이, 엽전 발생, 수령 프레임을 한지와 녹청 위에서 비교"></details></main><script>
const videos=[...document.querySelectorAll('video')];document.getElementById('play').onclick=()=>videos.forEach(v=>{v.currentTime=0;v.play().catch(()=>{});});document.getElementById('pause').onclick=()=>videos.forEach(v=>v.pause());document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>videos.forEach(v=>{v.pause();v.currentTime=Math.min(Number(b.dataset.time),v.duration||5);}));document.getElementById('checker').onchange=e=>document.querySelectorAll('.stage').forEach(s=>s.classList.toggle('checker',e.target.checked));fetch('media-review/video-alpha-report.json').then(r=>r.json()).then(d=>document.getElementById('report').textContent=`${d.width}×${d.height} · ${d.frames}프레임 · ${d.fps}fps · ${d.duration.toFixed(2)}초 · 디코딩 알파 ${d.alphaDecodedMinMax.join('–')} · 모서리 알파 ${d.allFrameCornerAlphaMax} · 원본 보존 ${d.sourceUnchanged?'확인':'미확인'}`);
</script></body></html>
