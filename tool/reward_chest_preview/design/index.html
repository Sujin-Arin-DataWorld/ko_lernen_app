<body class="editorial">
<aside class="study" aria-label="Design study controls">
 <small id="study-label">DESIGNSTUDIE · BEISPIELDATEN</small>
 <div class="controls"><div class="switch"><button data-lang="de" aria-pressed="true">DE</button><button data-lang="en" aria-pressed="false">EN</button></div><select id="object-select" aria-label="Reward shape"><option value="JagaeMungap">Perlmutt-Truhe</option><option value="Seokdeung">Steinlaterne</option></select><button class="replay" id="replay" aria-label="Replay">↻</button></div>
 <div class="switch"><button id="app-type" aria-pressed="false">App-Schrift</button><button id="editorial-type" aria-pressed="true">Kultur-Titel</button></div>
</aside>
<main class="receipt" aria-busy="true">
 <figure class="object"><button class="artifact" aria-label="Inspect reward"><img alt=""></button></figure>
 <header class="title"><p class="eyebrow" id="eyebrow"></p><h1 id="item-name"></h1><p class="term" id="term"></p></header>
 <section class="paper-card" aria-labelledby="item-name">
  <p class="meaning" id="meaning"></p>
  <button class="story-toggle" aria-haspopup="dialog" aria-controls="cultural-dialog"><span id="story-label"></span><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="story-fold" id="story" inert><div><p id="story-copy"></p></div></div>
  <div class="xp"><div class="xp-top"><span id="xp-label"></span><strong id="xp-value"></strong></div><div class="meter" role="progressbar" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"><span></span></div><div class="xp-bottom"><span id="level"></span><span id="next-level"></span></div></div>
 </section>
</main>
<footer class="action-dock"><button class="primary" id="place"><span id="cta"></span><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button><p class="hint" id="hint"></p></footer>
<dialog id="confirmation"><h2 id="preview-title"></h2><p id="preview-copy"></p><button id="close-dialog"></button></dialog>
<dialog class="cultural" id="cultural-dialog" aria-labelledby="culture-title" aria-describedby="culture-meaning">
 <header class="culture-head"><p class="culture-eyebrow" id="culture-eyebrow"></p><button class="close-icon" id="close-culture" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button><h2 id="culture-title"></h2><p class="term" id="culture-term"></p></header>
 <div class="culture-body"><p id="culture-meaning"></p><p class="culture-story" id="culture-story"></p></div>
 <footer class="culture-foot"><button class="primary" id="culture-done"></button></footer>
</dialog>
<script>
const ui={de:{study:'DESIGNSTUDIE · BEISPIELDATEN',app:'App-Schrift',editorial:'Kultur-Titel',inspect:'Belohnung ansehen',replay:'Animation wiederholen',hint:'Vorschau · Objekt antippen, Kulturgeschichte öffnen',title:'Nur eine Vorschau',close:'Verstanden'},en:{study:'DESIGN STUDY · DEMO DATA',app:'App type',editorial:'Cultural title',inspect:'Inspect reward',replay:'Replay animation',hint:'Preview · tap the object, explore its cultural story',title:'Preview only',close:'Got it'}};
const asset={JagaeMungap:'decoration_jagae_mungap',Seokdeung:'decoration_seokdeung'};
const boundsCache=new Map();
let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'de',arb={},catalog,version=0;
const el=id=>document.getElementById(id);
const artifact=document.querySelector('.artifact'),image=artifact.querySelector('img');
function replay(){document.body.classList.remove('arrival');requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('arrival')))}
function setStory(open){document.querySelector('.story-toggle').setAttribute('aria-expanded',String(open));el('story').classList.toggle('open',open);el('story').inert=!open}
async function measure(src){if(boundsCache.has(src))return boundsCache.get(src);const img=new Image();img.src=src;await img.decode();const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);const {data}=ctx.getImageData(0,0,canvas.width,canvas.height);let left=canvas.width,top=canvas.height,right=0,bottom=0;for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++)if(data[(y*canvas.width+x)*4+3]>20){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y)}const b=right>=left?{left,top,width:right-left+1,height:bottom-top+1,iw:canvas.width,ih:canvas.height}:{left:0,top:0,width:canvas.width,height:canvas.height,iw:canvas.width,ih:canvas.height};boundsCache.set(src,b);return b}
function fit(b){
 const main=document.querySelector('main'),object=document.querySelector('.object');
 document.body.classList.remove('arrival');
 main.style.removeProperty('grid-template-rows');
 document.body.classList.remove('compact','lean');
 if(object.clientHeight<110||main.scrollHeight>main.clientHeight+1)document.body.classList.add('compact');
 if(object.clientHeight<64||main.scrollHeight>main.clientHeight+1)document.body.classList.add('lean');
 const maxW=Math.min(object.clientWidth-12,330),maxH=Math.min(object.clientHeight-10,280);
 const scale=Math.max(.01,Math.min(maxW/b.width,maxH/b.height));
 if(!matchMedia('(min-width:520px) and (max-height:600px)').matches)main.style.gridTemplateRows=`${b.height*scale+8}px auto auto`;
 artifact.style.width=`${b.width*scale}px`;
 artifact.style.height=`${b.height*scale}px`;
 image.style.width=`${b.iw*scale}px`;
 image.style.height=`${b.ih*scale}px`;
 image.style.left=`${-b.left*scale}px`;
 image.style.top=`${-b.top*scale}px`;
}
async function render(){
 const run=++version,shape=el('object-select').value,copy=ui[lang];
 document.documentElement.lang=lang;
 arb=await(await fetch(`/lib/l10n/app_${lang}.arb`,{cache:'no-store'})).json();
 if(run!==version)return;
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
 el('study-label').textContent=copy.study;
 el('app-type').textContent=copy.app;
 el('editorial-type').textContent=copy.editorial;
 artifact.setAttribute('aria-label',copy.inspect);
 el('object-select').setAttribute('aria-label',lang==='de'?'Form der Belohnung':'Reward shape');
 el('replay').setAttribute('aria-label',copy.replay);
 el('hint').textContent=copy.hint;
 el('preview-title').textContent=copy.title;
 el('preview-copy').textContent=arb.rewardChestPreviewPlacement;
 el('close-dialog').textContent=copy.close;
 el('culture-done').textContent=copy.close;
 el('close-culture').setAttribute('aria-label',lang==='de'?'Schließen':'Close');
 el('culture-eyebrow').textContent=lang==='de'?'KULTURGESCHICHTE':'CULTURAL STORY';
 el('eyebrow').textContent=arb.rewardChestNewDecoration.toLocaleUpperCase(lang);
 el('item-name').textContent=arb[`decorName${shape}`];
 el('term').textContent=arb[`decorTerm${shape}`];
 for(const option of el('object-select').options)option.textContent=arb[`decorName${option.value}`];
 const entry=catalog.entries.find(e=>e.decorationSlugs.includes(asset[shape]));
 el('meaning').textContent=entry?.localizations[lang].meaning??'';
 el('story-copy').textContent=entry?.localizations[lang].story??'';
 el('culture-title').textContent=arb[`decorName${shape}`];
 el('culture-term').textContent=arb[`decorTerm${shape}`];
 el('culture-meaning').textContent=entry?.localizations[lang].meaning??'';
 el('culture-story').textContent=entry?.localizations[lang].story??'';
 document.querySelector('.story-toggle').hidden=!entry;
 el('story-label').textContent=arb.rewardChestCulturalStory;
 el('xp-label').textContent=arb.rewardChestLearningXp;
 el('xp-value').textContent=`${new Intl.NumberFormat(lang).format(1280)} XP`;
 el('level').textContent=arb.statsLevelLabel.replace('{n}','13');
 el('next-level').textContent=arb.statsToNextLevel.replace('{n}','20').replace('{next}','14');
 document.querySelector('.meter').setAttribute('aria-label',arb.rewardChestLearningXp);
 el('cta').textContent=arb.rewardChestPlaceSarangbang;
 setStory(false);
 const src=`/assets/illustrations/decorations/${asset[shape]}.png`,bounds=await measure(src);
 if(run!==version)return;
 image.src=src;
 await document.fonts.load('16px Sori');
 await document.fonts.ready;
 if(run!==version)return;
 fit(bounds);
 document.querySelector('main').setAttribute('aria-busy','false');
 replay();
}
function refit(){const b=boundsCache.get(image.getAttribute('src'));if(b)fit(b)}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});el('object-select').onchange=render;el('app-type').onclick=()=>{document.body.classList.remove('editorial');el('app-type').setAttribute('aria-pressed','true');el('editorial-type').setAttribute('aria-pressed','false');refit()};el('editorial-type').onclick=()=>{document.body.classList.add('editorial');el('app-type').setAttribute('aria-pressed','false');el('editorial-type').setAttribute('aria-pressed','true');refit()};el('replay').onclick=replay;artifact.onclick=()=>{artifact.classList.remove('turn');requestAnimationFrame(()=>artifact.classList.add('turn'))};document.querySelector('.story-toggle').onclick=()=>el('cultural-dialog').showModal();el('place').onclick=()=>el('confirmation').showModal();el('close-dialog').onclick=()=>el('confirmation').close();el('close-culture').onclick=el('culture-done').onclick=()=>el('cultural-dialog').close();addEventListener('resize',refit);document.fonts.ready.then(refit);
const params=new URLSearchParams(location.search);
document.body.classList.toggle('layout-audit',params.get('motion')==='off');
if(Object.hasOwn(asset,params.get('shape')))el('object-select').value=params.get('shape');
document.body.classList.toggle('presentation',params.get('present')==='1');
if(params.get('type')==='app')el('app-type').click();
fetch('/docs/data/cultural_glossary.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{catalog=data;return render()}).catch(()=>{el('item-name').textContent=lang==='de'?'Vorschau nicht verfügbar':'Preview unavailable';document.querySelector('main').setAttribute('aria-busy','false')});
</script>
