name: CI

# 변경된 제품 영역만 검증한다. 문서 전용 변경은 runner를 만들지 않고, 앱·각
# Firebase 함수·웹사이트는 서로 독립적으로 선택한다. CI 설정이나 공용 Rules가
# 바뀌면 분류기가 관련 게이트를 보수적으로 모두 연다.

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      # 아래 경로는 문서처럼 보여도 테스트/배포 계약의 입력이다.
      - '.github/**'
      - 'functions/**'
      - 'hangul-sori-site-local/**'
      - 'docs/store/**'
      - 'docs/privacy.html'
      - 'docs/support.html'
      - 'docs/data/cultural_glossary.json'
      - 'docs/assets/**'
      - 'docs/screenshots/**'
      - 'docs/SESSION_CHANGES_2026-07-31.md'
      - 'docs/CNAME'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '.github/**'
      - 'functions/**'
      - 'hangul-sori-site-local/**'
      - 'docs/store/**'
      - 'docs/privacy.html'
      - 'docs/support.html'
      - 'docs/data/cultural_glossary.json'
      - 'docs/assets/**'
      - 'docs/screenshots/**'
      - 'docs/SESSION_CHANGES_2026-07-31.md'
      - 'docs/CNAME'
  workflow_dispatch:
    inputs:
      task:
        description: 실행 범위(ci=변경 자동 감지, full=전체)
        required: false
        default: ci
        type: choice
        options:
          - ci
          - full
          - flutter
          - website
          - book
          - gye
          - pronunciation
          - ios
          - release-internal
          - release-website
          - regenerate-goldens

permissions:
  contents: read

# 자동 PR과 같은 브랜치의 수동 task=ci도 같은 그룹이다. PR의 낡은 검증은
# 취소하지만 main push는 Play release까지 끝내야 하므로 후속 웹/문서 push가
# 실행 전체를 중단하지 않는다. 골든 생성은 일반 CI와 별도 그룹으로 둔다.
# 수동 workflow_dispatch(release-website 등)도 이 'ci' 그룹을 공유하면, 여러
# 세션이 몇 분 간격으로 main에 계속 push하는 이 저장소에서는 대기열에 들어간
# 순간 다음 push로 계속 갈아치워져 잡이 하나도 못 뜬다(실측: 2026-08-18,
# release-website 두 번 연속 0 jobs로 대기만 하다 교체됨). dispatch 실행은
# run id로 자기만의 그룹을 둬 그 경합에서 아예 빠진다 — release-website 잡
# 자체의 전용 concurrency(cloudflare-production-deploy)는 그대로 유지되어
# dispatch끼리 겹칠 때의 직렬화는 그쪽에서 계속 보장한다.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.task == 'regenerate-goldens' && 'goldens' || (github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id)) || 'ci' }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select required checks
    if: github.event_name != 'workflow_dispatch' || inputs.task != 'regenerate-goldens'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      app: ${{ steps.scope.outputs.app }}
      website: ${{ steps.scope.outputs.website }}
      book: ${{ steps.scope.outputs.book }}
      gye: ${{ steps.scope.outputs.gye }}
      pronunciation: ${{ steps.scope.outputs.pronunciation }}
      tts: ${{ steps.scope.outputs.tts }}
      auth_cleanup: ${{ steps.scope.outputs.auth_cleanup }}
      ios: ${{ steps.scope.outputs.ios }}
      content: ${{ steps.scope.outputs.content }}
      flutter_test_mode: ${{ steps.flutter_tests.outputs.flutter_test_mode }}
      flutter_tests: ${{ steps.flutter_tests.outputs.flutter_tests }}
    steps:
      # fetch-depth: 0 은 checkout 이 +refs/heads/* +refs/tags/* 를 전부
      # 받는다. 세션 브랜치가 많은 이 저장소에서는 5분 job timeout 을
      # 넘긴다 (PR 95 run 32257638693: git fetch 가 13:21:42→13:26:41 에
      # cancelled → Select required checks 가 PR 필수 체크로 빨간불).
      # 비교·grant ledger 에 필요한 건 default branch 조상과 PR/push SHA
      # 뿐이라, tip 만 받은 뒤 blob 없이 그 이력만 가져온다.
      - name: Checkout tip
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Fetch comparison history
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
          extra=()
          if [ -n "${CI_PR_HEAD_SHA:-}" ]; then
            extra+=("${CI_PR_HEAD_SHA}" "${CI_PR_BASE_SHA}")
          fi
          if [ -n "${CI_BEFORE_SHA:-}" ] && [ "${CI_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            extra+=("${CI_BEFORE_SHA}")
          fi
          if [ "${#extra[@]}" -gt 0 ]; then
            git fetch --no-tags --filter=blob:none origin "${extra[@]}"
          fi
          if [ -z "${CI_PR_HEAD_SHA:-}" ] && { [ -z "${CI_BEFORE_SHA:-}" ] || [ "${CI_BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; }; then
            # workflow_dispatch 처럼 비교 SHA 가 없는 이벤트는 checkout 이 depth 1 이라
            # merge-base(HEAD, origin/main) 가 실패한다(한옥 grant 이력 검증이 사용).
            # 현재 ref 의 이력을 unshallow 로 채워 공통 조상을 복원한다.
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --no-tags --filter=blob:none --unshallow origin \
                "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            fi
          fi

      - name: Verify CI and release contracts
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Verify append-only Living Hanok grant history
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 tools/content_factory/build_hanok_grants.py
          --check --verify-git-history

      - name: Classify changed paths
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_SHA: ${{ github.sha }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_REF_NAME: ${{ github.ref_name }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_MANUAL_TASK: ${{ inputs.task || 'ci' }}
        run: python3 .github/scripts/ci_scope.py

      # Pull requests run only the tests whose Dart import closure touches the
      # change (plus the always-on guards); main pushes and manual runs keep the
      # full suite. Content, l10n, pubspec, goldens and platform changes fall
      # back to the full suite because no import edge protects them.
      - name: Select Flutter tests for this event
        id: flutter_tests
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_SHA: ${{ github.sha }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_REF_NAME: ${{ github.ref_name }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_MANUAL_TASK: ${{ inputs.task || 'ci' }}
        run: python3 .github/scripts/select_flutter_tests.py

  workflow-integrity:
    name: Workflow action pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install PyYAML
        run: pip install pyyaml==6.0.2

      - name: Verify release-toolchain manifest
        run: python tool/release_integrity.py manifest

      - name: Verify every workflow action is SHA-pinned
        run: >-
          python tool/release_integrity.py actions
          .github/workflows/ci.yml
          .github/workflows/play_closed.yml
          .github/workflows/playwright.yml

  website:
    name: Website source and Worker release gate
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hangul-sori-site-local
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pinned website Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: hangul-sori-site-local/.node-version
          cache: npm
          cache-dependency-path: hangul-sori-site-local/package-lock.json

      - name: Install locked website dependencies
        run: npm ci

      - name: Verify owned website release
        run: npm run deploy:check

  build:
    name: Analyze & Build
    needs: changes
    # Draft pull requests do not spend Actions minutes; mark ready for review
    # (or push to main) to run the gate.
    if: >-
      needs.changes.outputs.app == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure FFmpeg for matte verification
        run: |
          set -euo pipefail
          # apt ffmpeg pulls ~80 packages. Azure Ubuntu mirrors Ign: then
          # archive.ubuntu.com and die at timeout 180s (exit 124). Matte
          # checks need ffmpeg + ffprobe — GitHub static binaries, no apt.
          # ffmpeg alone is not enough: check_home_hero_matte.py dies
          # without ffprobe (color-tag contract).
          install_static() {
            local name="$1"
            if command -v "$name" >/dev/null 2>&1; then
              "$name" -version | head -1
              return 0
            fi
            local tmp
            tmp="$(mktemp)"
            timeout 90s curl -fsSL -o "$tmp" \
              "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/${name}-linux-x64"
            test "$(wc -c < "$tmp")" -gt 1000000
            chmod +x "$tmp"
            sudo mv "$tmp" "/usr/local/bin/${name}"
            "$name" -version | head -1
          }
          install_static ffmpeg
          install_static ffprobe


      - name: Verify character video mattes
        run: |
          python3 tool/check_clip_matte.py --check
          python3 tool/check_home_hero_matte.py --check

      - name: Analyze (error 0 강제 · warning·info 허용)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # main과 수동 실행은 responsive/source guards까지 포함한 전체 회귀 그물이다.
      # pull_request는 changes 잡이 고른 import-closure 테스트 + 상시 가드만 돈다.
      - name: Test
        env:
          FLUTTER_TEST_MODE: ${{ needs.changes.outputs.flutter_test_mode }}
          FLUTTER_TESTS: ${{ needs.changes.outputs.flutter_tests }}
        run: |
          set -euo pipefail
          if [[ "$FLUTTER_TEST_MODE" == "scoped" && -n "$FLUTTER_TESTS" ]]; then
            echo "Scoped pull_request run: $FLUTTER_TESTS"
            # shellcheck disable=SC2086
            flutter test $FLUTTER_TESTS
          else
            flutter test
          fi

      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-failures
          path: test/goldens/failures/**
          if-no-files-found: ignore
          retention-days: 3

      # Web release build proves the tree compiles for the web target; main and
      # manual runs pay for it, pull requests rely on analyze + scoped tests.
      - name: Build web (release)
        if: github.event_name != 'pull_request'
        run: flutter build web --release

  # Compile native privacy/auth bridges without signing or store access.
  # Reuse the existing Xcode Cloud dependency setup; publishing remains W9-owned.
  ios-native-build:
    name: Unsigned iOS release build
    needs: changes
    if: >-
      needs.changes.outputs.ios == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
      # device_info_plus 13.2 requires declarations absent from the runner's
      # default Xcode 16.4 SDK. Keep setup, device build and simulator on one SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify pinned Xcode and iOS SDKs
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          test "${xcode_version%%$'\n'*}" = "Xcode 26.3"
          for sdk in iphoneos iphonesimulator; do
            sdk_version="$(xcrun --sdk "$sdk" --show-sdk-version)"
            sdk_path="$(xcrun --sdk "$sdk" --show-sdk-path)"
            printf '%s SDK %s: %s\n' "$sdk" "$sdk_version" "$sdk_path"
            test "$sdk_version" = "26.2"
            case "$sdk_path" in
              "$DEVELOPER_DIR"/*) ;;
              *) echo "SDK resolved outside the pinned Xcode" >&2; exit 1 ;;
            esac
          done
      - name: Prepare existing pinned iOS toolchain and plugins
        run: bash ios/ci_scripts/ci_post_clone.sh
      - name: Compile release app without signing
        run: |
          export PATH="$HOME/flutter/bin:$HOME/.pub-cache/bin:$PATH"
          flutter build ios --release --no-codesign

  # The cold Intel simulator setup/build needs its own bounded 75-minute clock;
  # device release keeps 45 minutes. Both jobs retain the same toolchain contract.
  ios-native-tests:
    name: iOS simulator native tests
    needs: changes
    if: >-
      needs.changes.outputs.ios == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Locked ML Kit binaries provide x86_64 simulator slices, not arm64 simulator.
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify native Intel simulator host
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          printf 'Simulator host architecture: %s\n' "$host_arch"
          test "$host_arch" = "x86_64"
      - name: Verify pinned Xcode and iOS SDKs
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          test "${xcode_version%%$'\n'*}" = "Xcode 26.3"
          for sdk in iphoneos iphonesimulator; do
            sdk_version="$(xcrun --sdk "$sdk" --show-sdk-version)"
            sdk_path="$(xcrun --sdk "$sdk" --show-sdk-path)"
            printf '%s SDK %s: %s\n' "$sdk" "$sdk_version" "$sdk_path"
            test "$sdk_version" = "26.2"
            case "$sdk_path" in
              "$DEVELOPER_DIR"/*) ;;
              *) echo "SDK resolved outside the pinned Xcode" >&2; exit 1 ;;
            esac
          done
      - name: Prepare existing pinned iOS toolchain and plugins
        run: bash ios/ci_scripts/ci_post_clone.sh
      - name: Run native privacy tests on an installed iPhone simulator
        run: |
          set -euo pipefail
          export PATH="$HOME/flutter/bin:$HOME/.pub-cache/bin:$PATH"
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, group in devices.items() if "iOS-" in runtime for d in group if d["isAvailable"] and d["name"].startswith("iPhone")))')"
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$simulator_id,arch=x86_64" \
            -only-testing:RunnerTests CODE_SIGNING_ALLOWED=NO ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES \
            FLUTTER_TARGET=test/support/native_test_host.dart FLUTTER_BUILD_MODE=debug \
            -resultBundlePath "$RUNNER_TEMP/native-privacy.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/native-privacy-build-test.log"
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-privacy-results
          path: |
            ${{ runner.temp }}/native-privacy.xcresult
            ${{ runner.temp }}/native-privacy-build-test.log
          if-no-files-found: error
          retention-days: 3

  # Android 자동배포는 Google Play **내부 테스트(internal)** 만 쓴다.
  # 비공개 테스트(Closed Testing / alpha)·공개 테스트(beta)·Production·
  # iOS/TestFlight 는 이 워크플로가 절대 쓰지 않는다. 테스터 목록은 Play
  # Console 내부 테스트 이메일(Jin 전용)이고, 트랙 승격은 자동화하지 않는다.
  release-internal:
    name: Signed AAB to Play Internal Testing
    needs: [changes, build]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.changes.outputs.app == 'true' &&
      vars.PLAY_INTERNAL_RELEASE_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.task == 'release-internal'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: google-play-internal
      cancel-in-progress: false
    environment:
      name: google-play-internal
    steps:
      - name: Checkout exact release commit with version history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The obfuscated release build plus the Flutter, Android SDK and Gradle
      # trees fill the ~14 GB runner disk. On 2026-08-17 (run 32001006286) the
      # Play upload succeeded and then setup-java's post-step Gradle cache save
      # died with "No space left on device", turning a good release red. Drop
      # preinstalled toolchains this job never uses and do not persist the
      # multi-GB Gradle cache from here; a fresh dependency download costs a
      # couple of minutes, a failed post-step costs a red main run.
      - name: Free runner disk for the release build
        shell: bash
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/.ghcup \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL" || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean || true
          df -h / | tail -1

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      # Private-repository ubuntu runners have less memory than the developer
      # workstation. Override the repository's local 8G/4G Gradle profile only
      # inside this disposable runner so Flutter, Gradle, Kotlin and native
      # compilation cannot overcommit RAM and be terminated with exit 143.
      - name: Fit Gradle to GitHub runner memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          {
            printf '%s\n' 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
            printf '%s\n' 'org.gradle.workers.max=2'
            printf '%s\n' 'org.gradle.parallel=false'
            printf '%s\n' 'org.gradle.daemon=false'
            printf '%s\n' 'org.gradle.vfs.watch=false'
            printf '%s\n' 'kotlin.compiler.execution.strategy=in-process'
          } > "$HOME/.gradle/gradle.properties"
          free -h

      - name: Restore Android upload signing
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required Android signing secret: ${name}"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storeFile=../upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Install dependencies and generate localizations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build signed internal-testing bundle
        run: >-
          flutter build appbundle --release --obfuscate
          --split-debug-info=build/app/outputs/symbols
          --dart-define=ENABLE_TESTER_FEEDBACK=true
          --dart-define=BETA_UNLOCK_ALL=true
          --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Preserve Android failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-failure-${{ github.run_number }}-${{ github.sha }}
          path: |
            android/**/*.hprof
            android/build/reports/**
            build/**/logs/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Record bundle identity
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          sha256sum "$aab" | tee "$aab.sha256"
          short_sha="${GITHUB_SHA:0:8}"
          echo "name=${GITHUB_RUN_NUMBER} · ${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Preserve AAB and Dart symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-internal-${{ github.run_number }}-${{ github.sha }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
            build/app/outputs/symbols/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sujinarin.ko_lernen_app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # Play track 이름. Closed Testing 기본 트랙은 alpha 다. 여기 값을
          # internal 이외로 바꾸면 비공개/공개/프로덕션에 올라간다.
          tracks: internal
          status: completed
          releaseName: ${{ steps.release-meta.outputs.name }}
          inAppUpdatePriority: 0

  release-website:
    name: Website to Cloudflare Production
    needs: [changes, website]
    if: >-
      always() &&
      needs.website.result == 'success' &&
      needs.changes.outputs.website == 'true' &&
      vars.WEBSITE_PRODUCTION_RELEASE_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.task == 'release-website'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 워크플로 전체 concurrency 그룹(CI-ci-main)을 그대로 쓰면 이 저장소처럼
    # 여러 세션이 잦은 간격으로 main에 push할 때마다 아직 안 끝난 배포가
    # 매번 취소된다(실측: 2026-08-18 세 번 연속). Play 배포와 같은 방식으로
    # 전용 그룹을 둬 다른 push에 취소되지 않고 큐에서 순서대로 돈다.
    concurrency:
      group: cloudflare-production-deploy
      cancel-in-progress: false
    environment:
      name: cloudflare-production
    defaults:
      run:
        working-directory: hangul-sori-site-local
    env:
      CI: 'true'
      WORKERS_CI: '1'
      WORKERS_CI_BRANCH: main
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact production commit with ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up pinned website Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: hangul-sori-site-local/.node-version
          cache: npm
          cache-dependency-path: hangul-sori-site-local/package-lock.json

      - name: Install locked website dependencies
        run: npm ci

      - name: Verify, deploy, and prove the exact live release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing Cloudflare production credentials."
            exit 1
          fi
          npm run deploy

  book-analysis-security:
    name: Book analysis security
    needs: changes
    if: needs.changes.outputs.book == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: functions/analyze_korean_text/requirements.txt

      - name: Install function dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r functions/analyze_korean_text/requirements.txt

      - name: Test function security boundary
        working-directory: functions/analyze_korean_text
        run: python -m unittest discover -p "test_*.py"

  gye-functions-security:
    name: Gye functions and rules security
    needs: changes
    if: needs.changes.outputs.gye == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/gye/package-lock.json

      - name: Set up Java 21 for Firestore emulator
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gye function dependencies
        working-directory: functions/gye
        run: npm ci

      - name: Test Gye runtime boundaries
        working-directory: functions/gye
        run: npm test

      - name: Test Firestore rules
        working-directory: functions/gye
        run: npm run test:rules

      - name: Test canonical and private TTS Storage rules
        working-directory: functions/gye
        run: npm run test:storage-rules

      - name: Test billing transaction and deletion races
        working-directory: functions/gye
        run: npm run test:billing-emulator

  pronunciation-functions-security:
    name: Pronunciation function security
    needs: changes
    if: needs.changes.outputs.pronunciation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/pronunciation/package-lock.json

      - name: Install pronunciation function dependencies
        working-directory: functions/pronunciation
        run: npm ci

      - name: Test request and regional processing boundaries
        working-directory: functions/pronunciation
        run: npm test

  tts-functions-security:
    name: TTS function security
    needs: changes
    if: needs.changes.outputs.tts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/tts/package-lock.json

      - name: Install TTS function dependencies
        working-directory: functions/tts
        run: npm ci

      - name: Set up Python for canonical corpus verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify canonical TTS allowlists match runtime content
        run: python functions/tts/build_canonical_manifest.py --check

      - name: Test cache-key and request-guard contracts
        working-directory: functions/tts
        run: npm test

  tts-storage-verify:
    name: TTS Storage completeness (content)
    needs: changes
    # Draft pull requests do not spend Actions minutes; mark ready for review
    # (or push to main) to run the gate. Same style as the build job's guard.
    if: >-
      needs.changes.outputs.content == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fail with a clear message when the GCS secret is missing
        env:
          GCS_TTS_VERIFY_SA_JSON: ${{ secrets.GCS_TTS_VERIFY_SA_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GCS_TTS_VERIFY_SA_JSON}" ]; then
            echo "::error::GCS_TTS_VERIFY_SA_JSON is not set — ask Jin to register a storage.objectViewer service account key (W9-A) before this gate can run."
            exit 1
          fi

      - name: Authenticate to Google Cloud (read-only)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCS_TTS_VERIFY_SA_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify TTS Storage completeness
        run: python -X utf8 tool/generate_tts.py --verify-storage

  auth-cleanup-functions-security:
    name: Auth cleanup function security
    needs: changes
    if: needs.changes.outputs.auth_cleanup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/auth_cleanup/package-lock.json

      - name: Install auth-cleanup function dependencies
        working-directory: functions/auth_cleanup
        run: npm ci

      - name: Test Auth-deletion Firestore cascade bridge
        working-directory: functions/auth_cleanup
        run: npm test

  # tool/*.py의 이미지 파이프라인 유닛 테스트. tool/__init__.py가 이걸 위해
  # 존재하지만 지금까지 CI 어디서도 돌지 않았다 — docs/assets/**(원장·스테이지
  # 스펙)나 tool/**가 바뀌어도 app 스코프로 잡히므로 이 잡이 그 신호를 받는다.
  asset-gates:
    name: Asset pipeline gates
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install image pipeline dependencies
        run: pip install pillow==10.4.0 numpy==2.0.1 scipy==1.16.1 pyyaml==6.0.2

      # R4's real-interpreter spawn tests run ~63-67s on Windows-like spawn
      # overhead and R3 ~6s; a dedicated step + timeout keeps a slow family
      # diagnosable on its own instead of hiding inside the full discover run.
      - name: Run tool/ release-integrity tests
        timeout-minutes: 5
        run: python -m unittest tool.test_release_integrity tool.test_android_release_evidence tool.test_android_release_tools_config -v

      - name: Run tool/ unit tests (image pipeline and the rest)
        run: python -m unittest discover -s tool -p "test_*.py" -t .

  # 골든은 수동 task=regenerate-goldens에서만 만든다. 일반 수동 CI와 동시에
  # 실행하지 않아 전체 Flutter 테스트를 중복 과금하지 않는다.
  regenerate-goldens:
    name: Regenerate goldens (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'regenerate-goldens'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Update goldens
        run: flutter test --update-goldens test/goldens

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goldens-linux-3-44-0
          path: test/goldens/baselines/**
          retention-days: 7
