name: CI

# "살아있는 한옥" 회귀 방지 — push/PR마다 analyze(error 0) + 빌드 성공을 강제.
# warning은 통과(개발 중 미완성 기능의 unused 파라미터 등은 빌드 무해).
# 컴파일이나 정적 분석 error가 나면 자동 차단된다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 골든 기준선 재생성(수동). 골든은 렌더러 고정이 전제라 **CI 환경(Linux +
  # 아래 flutter-version 핀)이 정본**이다. Windows/macOS 에서
  # `--update-goldens` 를 돌리면 그 머신 래스터라이즈가 박혀 CI 가 빨간불이
  # 된다 — 반드시 이 잡으로 만들고, 산출물을 내려받아 커밋할 것.
  workflow_dispatch:

jobs:
  build:
    name: Analyze & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify character video mattes
        run: |
          python3 tool/check_clip_matte.py --check
          python3 tool/check_home_hero_matte.py --check

      - name: Analyze (error 0 강제 · warning·info 허용)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # 2026-07-31 추가 — 그동안 CI가 테스트를 아예 안 돌리고 있었다.
      # 골든 테스트가 없어 responsive_test(오버플로 검사)와 소스 가드 래칫이
      # 유일한 회귀 그물이다. 이 스텝이 없으면 그 그물이 CI에서 무용지물.
      - name: Test
        run: flutter test

      # 골든이 깨지면 실제 렌더 이미지를 받아봐야 "진짜 회귀"인지 "환경 차이"인지
      # 구분할 수 있다. LocalFileComparator 가 test/goldens/failures/ 에
      # _masterImage/_testImage/_isolatedDiff/_maskedDiff 를 남긴다.
      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/goldens/failures/**

      - name: Build web (release)
        run: flutter build web --release

  book-analysis-security:
    name: Book analysis security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: functions/analyze_korean_text/requirements.txt

      - name: Install function dependencies
        run: pip install -r functions/analyze_korean_text/requirements.txt

      - name: Test function security boundary
        working-directory: functions/analyze_korean_text
        run: python -m unittest discover -p "test_*.py"

  gye-functions-security:
    name: Gye functions and rules security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/gye/package-lock.json

      - name: Set up Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gye function dependencies
        working-directory: functions/gye
        run: npm ci

      - name: Test Gye runtime boundaries
        working-directory: functions/gye
        run: npm test

      - name: Test Firestore rules
        working-directory: functions/gye
        run: npm run test:rules

  # 골든 기준선 재생성 — 수동 실행 전용(workflow_dispatch).
  # 위 build 잡과 **같은 OS·같은 flutter-version** 이어야 의미가 있다. 산출물
  # (test/goldens/baselines/**)을 내려받아 커밋하면 CI 골든이 초록이 된다.
  regenerate-goldens:
    name: Regenerate goldens (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Update goldens
        run: flutter test --update-goldens test/goldens

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: goldens-linux-3-44-0
          path: test/goldens/baselines/**
