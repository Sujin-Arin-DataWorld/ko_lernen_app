name: CI

# 변경된 제품 영역만 검증한다. 문서 전용 변경은 runner를 만들지 않고, 앱·각
# Firebase 함수·웹사이트는 서로 독립적으로 선택한다. CI 설정이나 공용 Rules가
# 바뀌면 분류기가 관련 게이트를 보수적으로 모두 연다.

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      # 아래 경로는 문서처럼 보여도 테스트/배포 계약의 입력이다.
      - '.github/**'
      - 'functions/**'
      - 'hangul-sori-site-local/**'
      - 'docs/store/**'
      - 'docs/privacy.html'
      - 'docs/support.html'
      - 'docs/screenshots/**'
      - 'docs/SESSION_CHANGES_2026-07-31.md'
      - 'docs/CNAME'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '.github/**'
      - 'functions/**'
      - 'hangul-sori-site-local/**'
      - 'docs/store/**'
      - 'docs/privacy.html'
      - 'docs/support.html'
      - 'docs/screenshots/**'
      - 'docs/SESSION_CHANGES_2026-07-31.md'
      - 'docs/CNAME'
  workflow_dispatch:
    inputs:
      task:
        description: 실행 범위(ci=변경 자동 감지, full=전체)
        required: false
        default: ci
        type: choice
        options:
          - ci
          - full
          - flutter
          - website
          - book
          - gye
          - pronunciation
          - regenerate-goldens

permissions:
  contents: read

# 자동 PR과 같은 브랜치의 수동 task=ci도 같은 그룹이다. 새 커밋/실행이 생기면
# 이미 낡은 검증은 취소하되 골든 생성은 일반 CI와 별도 그룹으로 둔다.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.task == 'regenerate-goldens' && 'goldens' || 'ci' }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select required checks
    if: github.event_name != 'workflow_dispatch' || inputs.task != 'regenerate-goldens'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.scope.outputs.app }}
      website: ${{ steps.scope.outputs.website }}
      book: ${{ steps.scope.outputs.book }}
      gye: ${{ steps.scope.outputs.gye }}
      pronunciation: ${{ steps.scope.outputs.pronunciation }}
    steps:
      - name: Checkout with comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify scope classifier
        run: python3 -m unittest discover -s .github/scripts -p "test_ci_scope.py"

      - name: Classify changed paths
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_SHA: ${{ github.sha }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_REF_NAME: ${{ github.ref_name }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_MANUAL_TASK: ${{ inputs.task || 'ci' }}
        run: python3 .github/scripts/ci_scope.py

  website:
    name: Website source and Worker release gate
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hangul-sori-site-local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned website Node
        uses: actions/setup-node@v4
        with:
          node-version-file: hangul-sori-site-local/.node-version
          cache: npm
          cache-dependency-path: hangul-sori-site-local/package-lock.json

      - name: Install locked website dependencies
        run: npm ci

      - name: Verify owned website release
        run: npm run deploy:check

  build:
    name: Analyze & Build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure FFmpeg for matte verification
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes ffmpeg
          fi

      - name: Verify character video mattes
        run: |
          python3 tool/check_clip_matte.py --check
          python3 tool/check_home_hero_matte.py --check

      - name: Analyze (error 0 강제 · warning·info 허용)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # responsive/source guards까지 포함한 전체 회귀 그물이다.
      - name: Test
        run: flutter test

      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/goldens/failures/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Build web (release)
        run: flutter build web --release

  book-analysis-security:
    name: Book analysis security
    needs: changes
    if: needs.changes.outputs.book == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: functions/analyze_korean_text/requirements.txt

      - name: Install function dependencies
        run: pip install -r functions/analyze_korean_text/requirements.txt

      - name: Test function security boundary
        working-directory: functions/analyze_korean_text
        run: python -m unittest discover -p "test_*.py"

  gye-functions-security:
    name: Gye functions and rules security
    needs: changes
    if: needs.changes.outputs.gye == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/gye/package-lock.json

      - name: Set up Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gye function dependencies
        working-directory: functions/gye
        run: npm ci

      - name: Test Gye runtime boundaries
        working-directory: functions/gye
        run: npm test

      - name: Test Firestore rules
        working-directory: functions/gye
        run: npm run test:rules

  pronunciation-functions-security:
    name: Pronunciation function security
    needs: changes
    if: needs.changes.outputs.pronunciation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/pronunciation/package-lock.json

      - name: Install pronunciation function dependencies
        working-directory: functions/pronunciation
        run: npm ci

      - name: Test request and regional processing boundaries
        working-directory: functions/pronunciation
        run: npm test

  # 골든은 수동 task=regenerate-goldens에서만 만든다. 일반 수동 CI와 동시에
  # 실행하지 않아 전체 Flutter 테스트를 중복 과금하지 않는다.
  regenerate-goldens:
    name: Regenerate goldens (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'regenerate-goldens'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Update goldens
        run: flutter test --update-goldens test/goldens

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: goldens-linux-3-44-0
          path: test/goldens/baselines/**
          retention-days: 7
