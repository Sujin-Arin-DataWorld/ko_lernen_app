name: CI

# "살아있는 한옥" 회귀 방지 — push/PR마다 analyze(error 0) + 빌드 성공을 강제.
# warning은 통과(개발 중 미완성 기능의 unused 파라미터 등은 빌드 무해).
# 컴파일이나 정적 분석 error가 나면 자동 차단된다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Analyze & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (error 0 강제 · warning·info 허용)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build web (release)
        run: flutter build web --release
