name: CI

# "살아있는 한옥" 회귀 방지 — push/PR마다 analyze 0 + 빌드 성공을 강제.
# 모션·디자인 작업이 컴파일이나 정적 분석을 깨뜨리면 자동 차단된다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Analyze & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (이슈 0 강제)
        run: flutter analyze

      - name: Build web (release)
        run: flutter build web --release
