name: CI

# "살아있는 한옥" 회귀 방지. 코드 변경은 analyze/test/build와 보안 경계를 검증하되,
# 문서 전용 변경과 이미 대체된 실행은 유료 runner 시간을 쓰지 않는다.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      task:
        description: 실행할 작업
        required: false
        default: ci
        type: choice
        options:
          - ci
          - regenerate-goldens

permissions:
  contents: read

# 같은 PR/브랜치에 새 실행이 생기면 오래된 실행을 취소한다. 수동 CI와 골든 생성은
# 서로 취소하지 않도록 task를 그룹 키에 포함한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.task || 'ci' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze & Build
    if: github.event_name != 'workflow_dispatch' || inputs.task != 'regenerate-goldens'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure FFmpeg for matte verification
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes ffmpeg
          fi

      - name: Verify character video mattes
        run: |
          python3 tool/check_clip_matte.py --check
          python3 tool/check_home_hero_matte.py --check

      - name: Analyze (error 0 강제 · warning·info 허용)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # responsive/source guards까지 포함한 전체 회귀 그물이다.
      - name: Test
        run: flutter test

      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/goldens/failures/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Build web (release)
        run: flutter build web --release

  book-analysis-security:
    name: Book analysis security
    if: github.event_name != 'workflow_dispatch' || inputs.task != 'regenerate-goldens'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: functions/analyze_korean_text/requirements.txt

      - name: Install function dependencies
        run: pip install -r functions/analyze_korean_text/requirements.txt

      - name: Test function security boundary
        working-directory: functions/analyze_korean_text
        run: python -m unittest discover -p "test_*.py"

  gye-functions-security:
    name: Gye functions and rules security
    if: github.event_name != 'workflow_dispatch' || inputs.task != 'regenerate-goldens'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/gye/package-lock.json

      - name: Set up Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gye function dependencies
        working-directory: functions/gye
        run: npm ci

      - name: Test Gye runtime boundaries
        working-directory: functions/gye
        run: npm test

      - name: Test Firestore rules
        working-directory: functions/gye
        run: npm run test:rules

  pronunciation-functions-security:
    name: Pronunciation function security
    if: github.event_name != 'workflow_dispatch' || inputs.task != 'regenerate-goldens'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/pronunciation/package-lock.json

      - name: Install pronunciation function dependencies
        working-directory: functions/pronunciation
        run: npm ci

      - name: Test request and regional processing boundaries
        working-directory: functions/pronunciation
        run: npm test

  # 골든은 수동 task=regenerate-goldens에서만 만든다. 일반 수동 CI와 동시에
  # 실행하지 않아 전체 Flutter 테스트를 중복 과금하지 않는다.
  regenerate-goldens:
    name: Regenerate goldens (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'regenerate-goldens'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Update goldens
        run: flutter test --update-goldens test/goldens

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: goldens-linux-3-44-0
          path: test/goldens/baselines/**
          retention-days: 7
