name: Google Play Closed Testing

# Closed Testing is an explicit release operation. It never runs on push or PR,
# and it accepts only the exact main SHA that already passed the normal CI.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character main commit SHA to release to Closed Testing
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: google-play-closed
  cancel-in-progress: false

jobs:
  release-closed:
    name: Signed AAB to Play Closed Testing
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # The existing protected environment owns the app-scoped Play and signing
    # secrets. Its historical name says "internal", but the credentials are
    # also authorized for this explicit alpha-track release.
    environment:
      name: google-play-internal
    steps:
      - name: Checkout exact release commit with version history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify explicit exact-main release target
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Closed Testing may only be released from main (got $GITHUB_REF)."
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Workflow SHA $GITHUB_SHA does not match expected_sha $EXPECTED_SHA."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Require successful exact-SHA main CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          successes="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=100" |
              jq --arg sha "$GITHUB_SHA" \
                '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")] | length'
          )"
          if [[ "$successes" -lt 1 ]]; then
            echo "::error::No successful push CI run exists for exact main SHA $GITHUB_SHA."
            exit 1
          fi

      - name: Free runner disk for the release build
        shell: bash
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/.ghcup \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL" || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean || true
          df -h / | tail -1

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Fit Gradle to GitHub runner memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          {
            printf '%s\n' 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
            printf '%s\n' 'org.gradle.workers.max=2'
            printf '%s\n' 'org.gradle.parallel=false'
            printf '%s\n' 'org.gradle.daemon=false'
            printf '%s\n' 'org.gradle.vfs.watch=false'
            printf '%s\n' 'kotlin.compiler.execution.strategy=in-process'
          } > "$HOME/.gradle/gradle.properties"
          free -h

      - name: Restore Android upload signing
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required Android signing secret: ${name}"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storeFile=../upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Install dependencies and generate localizations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build signed closed-testing bundle
        run: >-
          flutter build appbundle --release --obfuscate
          --split-debug-info=build/app/outputs/symbols
          --dart-define=ENABLE_TESTER_FEEDBACK=true
          --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Preserve Android failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-closed-failure-${{ github.run_number }}-${{ github.sha }}
          path: |
            android/**/*.hprof
            android/build/reports/**
            build/**/logs/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Record bundle identity
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          sha256sum "$aab" | tee "$aab.sha256"
          version_code="$(git rev-list --count HEAD)"
          short_sha="${GITHUB_SHA:0:8}"
          echo "version-code=$version_code" >> "$GITHUB_OUTPUT"
          echo "name=${GITHUB_RUN_NUMBER} · closed · ${short_sha}" >> "$GITHUB_OUTPUT"

      # R4 (tool/android_release_evidence.py): independently verifies the
      # exact built AAB's native symbols reached Crashlytics before the Play
      # upload runs. Off by default -- vars.ANDROID_SYMBOL_EVIDENCE_GATE must
      # be explicitly set to 'true'. See docs/runbooks/android-symbol-evidence.md
      # for the secrets/variables to provision and the one-time harvest that
      # fills tool/android_release_tools.json's sha256 placeholders.
      - name: Symbol evidence gate status
        shell: bash
        env:
          GATE_ENABLED: ${{ vars.ANDROID_SYMBOL_EVIDENCE_GATE }}
        run: |
          set -euo pipefail
          if [[ "$GATE_ENABLED" == "true" ]]; then
            echo "Symbol evidence gate: ENABLED (runs and must pass before the Play upload step)."
          else
            echo "Symbol evidence gate: DISABLED (release path unchanged)."
            echo "Harvest values for tool/android_release_tools.json (nothing downloaded here):"
            for name in java node; do
              path="$(command -v "$name" || true)"
              if [[ -n "$path" ]]; then
                echo "  $name: $path"
                sha256sum "$path"
              else
                echo "  $name: not found on this runner (no existing setup step installed it)"
              fi
            done
          fi

      - name: Read pinned release-toolchain versions
        if: vars.ANDROID_SYMBOL_EVIDENCE_GATE == 'true'
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          with open("tool/android_release_tools.json", encoding="utf-8") as handle:
              config = json.load(handle)
          for tool, fields in config.items():
              prefix = tool.replace("-", "_")
              for field, value in fields.items():
                  print(f"{prefix}_{field}={value}")
          PY

      - name: Pin release-toolchain Java
        if: vars.ANDROID_SYMBOL_EVIDENCE_GATE == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java_version }}

      - name: Pin release-toolchain Node
        if: vars.ANDROID_SYMBOL_EVIDENCE_GATE == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.toolchain.outputs.node_version }}

      - name: Download and verify bundletool
        if: vars.ANDROID_SYMBOL_EVIDENCE_GATE == 'true'
        id: bundletool
        shell: bash
        env:
          BUNDLETOOL_URL: ${{ steps.toolchain.outputs.bundletool_url }}
          BUNDLETOOL_SHA256: ${{ steps.toolchain.outputs.bundletool_sha256 }}
          BUNDLETOOL_VERSION: ${{ steps.toolchain.outputs.bundletool_version }}
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl -fsSL --retry 3 -o "$jar" "$BUNDLETOOL_URL"
          echo "${BUNDLETOOL_SHA256}  $jar" | sha256sum -c -
          echo "bundletool_jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Install and verify firebase-tools
        if: vars.ANDROID_SYMBOL_EVIDENCE_GATE == 'true'
        id: firebase-tools
        shell: bash
        env:
          FIREBASE_TOOLS_VERSION: ${{ steps.toolchain.outputs.firebase_tools_version }}
          FIREBASE_TOOLS_SHA256: ${{ steps.toolchain.outputs.firebase_tools_sha256 }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/firebase-tools-scratch"
          mkdir -p "$scratch"
          npm install --no-save --no-audit --no-fund --prefix "$scratch" \
            "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          firebase_js="$scratch/node_modules/firebase-tools/lib/bin/firebase.js"
          echo "${FIREBASE_TOOLS_SHA256}  $firebase_js" | sha256sum -c -
          echo "firebase_js=$firebase_js" >> "$GITHUB_OUTPUT"

      - name: Write release-evidence tools manifest
        if: vars.ANDROID_SYMBOL_EVIDENCE_GATE == 'true'
        id: tools-json
        shell: bash
        env:
          JAVA_BIN_SHA256: ${{ steps.toolchain.outputs.java_sha256 }}
          NODE_BIN_SHA256: ${{ steps.toolchain.outputs.node_sha256 }}
          BUNDLETOOL_JAR: ${{ steps.bundletool.outputs.bundletool_jar }}
          BUNDLETOOL_JAR_SHA256: ${{ steps.toolchain.outputs.bundletool_sha256 }}
          FIREBASE_JS: ${{ steps.firebase-tools.outputs.firebase_js }}
          FIREBASE_JS_SHA256: ${{ steps.toolchain.outputs.firebase_tools_sha256 }}
        run: |
          set -euo pipefail
          export JAVA_BIN="$(command -v java)"
          export NODE_BIN="$(command -v node)"
          manifest="$RUNNER_TEMP/release-evidence-tools.json"
          python3 - > "$manifest" <<'PY'
          import json
          import os
          java_bin = os.environ["JAVA_BIN"]
          node_bin = os.environ["NODE_BIN"]
          bundletool_jar = os.environ["BUNDLETOOL_JAR"]
          firebase_js = os.environ["FIREBASE_JS"]
          print(json.dumps({
              "bundletool": {
                  "argv": [java_bin, "-jar", bundletool_jar],
                  "sha256": {java_bin: os.environ["JAVA_BIN_SHA256"],
                             bundletool_jar: os.environ["BUNDLETOOL_JAR_SHA256"]},
              },
              "firebase": {
                  "argv": [node_bin, firebase_js],
                  "sha256": {node_bin: os.environ["NODE_BIN_SHA256"],
                             firebase_js: os.environ["FIREBASE_JS_SHA256"]},
              },
          }))
          PY
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Materialise Firebase credentials
        if: vars.ANDROID_SYMBOL_EVIDENCE_GATE == 'true'
        shell: bash
        env:
          FIREBASE_SYMBOLS_SA_JSON: ${{ secrets.FIREBASE_SYMBOLS_SA_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$FIREBASE_SYMBOLS_SA_JSON" ]]; then
            echo "::error::Missing required secret: FIREBASE_SYMBOLS_SA_JSON"
            exit 1
          fi
          if [[ -n "${FIREBASE_TOKEN:-}" ]]; then
            echo "::error::FIREBASE_TOKEN must not be set; this gate authenticates only via GOOGLE_APPLICATION_CREDENTIALS."
            exit 1
          fi
          (
            umask 077
            printf '%s' "$FIREBASE_SYMBOLS_SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          )

      - name: Upload and verify Crashlytics symbol evidence
        if: vars.ANDROID_SYMBOL_EVIDENCE_GATE == 'true'
        id: symbol-evidence
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          TOOLS_JSON: ${{ steps.tools-json.outputs.manifest }}
          VERSION_CODE: ${{ steps.release-meta.outputs.version-code }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          expected_sha256="$(cut -d' ' -f1 "$aab.sha256")"
          receipt="$RUNNER_TEMP/symbol-receipt.json"
          common_args=(
            --aab "$aab"
            --symbols build/app/outputs/symbols
            --google-services android/app/google-services.json
            --receipt "$receipt"
            --tools-json "$TOOLS_JSON"
            --git-sha "$GITHUB_SHA"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --version-code "$VERSION_CODE"
            --firebase-app-id "$FIREBASE_ANDROID_APP_ID"
            --expected-aab-sha256 "$expected_sha256"
          )
          python3 tool/android_release_evidence.py upload "${common_args[@]}"
          python3 tool/android_release_evidence.py verify "${common_args[@]}"
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"

      - name: Archive symbol evidence
        if: vars.ANDROID_SYMBOL_EVIDENCE_GATE == 'true'
        id: archive-evidence
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          TOOLS_JSON: ${{ steps.tools-json.outputs.manifest }}
          VERSION_CODE: ${{ steps.release-meta.outputs.version-code }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          RECEIPT: ${{ steps.symbol-evidence.outputs.receipt }}
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          expected_sha256="$(cut -d' ' -f1 "$aab.sha256")"
          archive_dir="$RUNNER_TEMP/symbol-evidence"
          python3 tool/android_release_evidence.py archive \
            --aab "$aab" \
            --symbols build/app/outputs/symbols \
            --google-services android/app/google-services.json \
            --receipt "$RECEIPT" \
            --tools-json "$TOOLS_JSON" \
            --git-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --version-code "$VERSION_CODE" \
            --firebase-app-id "$FIREBASE_ANDROID_APP_ID" \
            --expected-aab-sha256 "$expected_sha256" \
            --archive-dir "$archive_dir"
          echo "archive-dir=$archive_dir" >> "$GITHUB_OUTPUT"

      - name: Preserve symbol evidence artifact
        if: vars.ANDROID_SYMBOL_EVIDENCE_GATE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-symbol-evidence-v${{ steps.release-meta.outputs.version-code }}-${{ github.sha }}
          path: ${{ steps.archive-evidence.outputs.archive-dir }}
          if-no-files-found: error
          retention-days: 90

      - name: Preserve AAB and Dart symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-closed-v${{ steps.release-meta.outputs.version-code }}-${{ github.sha }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
            build/app/outputs/symbols/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play Closed Testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sujinarin.ko_lernen_app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: completed
          releaseName: ${{ steps.release-meta.outputs.name }}
          inAppUpdatePriority: 0
